
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste & Co. Restaurant</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Daytime Schedule -->
    <section class="schedule">
        <h2>Daytime Schedule</h2>
        <p>Open Daily: Sunday - Thursday | 8:00 AM - 6:00 PM</p>
    </section>

    <!-- Food Gallery -->
    <section class="gallery">
        <h2>Food Gallery</h2>

        <div class="gallery-container">

            <img src="./imges/burger.jpg"
                 alt="Healthy Food">

            <img src="./imges/cheken.jpg"
                 alt="Grilled Food">

            <img src="./imges/download.jpg"
                 alt="Fresh Salad">

            <img src="./imges/pizza1.jpg"
                 alt="Pasta">
        </div>
    </section>

    <!-- Image Preview -->
    <div class="image-modal" id="imageModal">
        <span class="close">&times;</span>
        <img id="modalImage" src="" alt="Food Preview">
    </div>


</body>
</html>
